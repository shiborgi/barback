version: 1
environment: local

server:
  host: env:BARBACK_SERVER_HOST
  port: 8080
  requestBodyLimit: 10mb
  gracefulShutdown: 30s
  allowedOrigins: []
  admin:
    host: env:BARBACK_ADMIN_HOST
    port: 8081

auth:
  clients:
    - id: default
      key: env:BARBACK_CLIENT_KEY
      policy: standard
      scopes: [llm:invoke, llm:models, mcp:list, mcp:call]
    - id: operator
      key: env:BARBACK_ADMIN_KEY
      policy: standard
      scopes: [admin]

providers:
  ollama-cloud:
    type: ollama
    baseUrl: https://ollama.com
    apiKey: env:OLLAMA_API_KEY
    timeout: 120s
    connectTimeout: 10s

models:
  code-default:
    provider: ollama-cloud
    upstreamModel: env:OLLAMA_CODE_MODEL
    capability: chat
    contextWindow: 131072
    maxOutput: 16384
    tokenizer: approximate
  cache-embedding:
    provider: ollama-cloud
    upstreamModel: env:OLLAMA_EMBEDDING_MODEL
    capability: embedding
    dimensions: 1024

storage:
  valkey:
    url: env:VALKEY_URL
    keyPrefix: barback
    connectTimeout: 5s
    vectorSearch: true

cache:
  defaultMode: none
  maxResponseBytes: 2097152
  exact:
    enabled: true
    defaultTtl: 15m
  semantic:
    enabled: true
    mode: shadow
    embeddingModel: cache-embedding
    threshold: 0.97
    maxMessages: 3
    defaultTtl: 15m
    sampleValidationRate: 0.10
    servingApproved: false
    servingCriteria:
      minimumCandidates: 500
      minimumPrecision: 0.99
      maximumFalseHitRate: 0.01

contextWindow:
  warningThreshold: 0.70
  compactThreshold: 0.85
  rejectThreshold: 0.95

policies:
  standard:
    cache: exact
    maxOutput: 16384
    models: [code-default]
    mcpToolsets: []

usageWindows: []

mcp:
  endpoint: /mcp
  protocol:
    primary: "2026-07-28"
    compatibility: ["2025-11-25", "2025-03-26"]
  servers: []
  # Optional google-mcp upstream, addressed by the container IP resolved at startup
  # (start-barback.sh injects GOOGLE_MCP_URL). Uncomment to enable:
  #  - id: google
  #    transport: streamable-http
  #    url: env:GOOGLE_MCP_URL
  #    required: false
  #    auth:
  #      bearerToken: env:GOOGLE_MCP_TOKEN
  #    tools:
  #      default: deny
  #      allow: [list_calendars, list_events, get_event, free_busy, create_event, update_event, delete_event, quick_add]
  #      policies:
  #        list_calendars: { effect: read, cache: { mode: exact, ttl: 5m } }
  #        list_events: { effect: read }
  #        get_event: { effect: read, cache: { mode: exact, ttl: 1m } }
  #        free_busy: { effect: read }
  #        create_event: { effect: write }
  #        update_event: { effect: write }
  #        delete_event: { effect: write }
  #        quick_add: { effect: write }
  toolsets: {}
  #  calendar:
  #    - google:list_calendars
  #    - google:list_events
  #    - google:get_event
  #    - google:free_busy
  #    - google:create_event
  #    - google:update_event
  #    - google:delete_event
  #    - google:quick_add
  argumentLimit: 1mb

telemetry:
  serviceName: barback
  prometheus:
    enabled: true
    path: /metrics
  otel:
    enabled: false
  logging:
    level: info
    captureContent: false
    captureHeaders: false
